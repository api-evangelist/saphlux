aid: saphlux
name: Saphlux
description: 'Saphlux is a quantum dot Micro-LED (QD-MLED) display technology company founded
  in 2014 out of Yale University and headquartered in San Diego, California, with additional
  operations in China and Japan. It commercialized semi-polar (20-21) GaN-on-sapphire epitaxial
  wafers to address efficiency droop and the green gap in nitride emitters, and now mass-produces
  NPQD quantum-dot Micro-LED devices. Its product lineup spans QD-COB and QD-COB Pro Series
  panels for large-format commercial and home-theater displays and the T-Series monolithic
  full-color micro-displays for all-day wearable AR eyewear and AI smart glasses. Saphlux is a
  semiconductor materials and display-module manufacturer that sells hardware to OEMs and
  display integrators; it publishes no public developer program, API, or SDK.'
